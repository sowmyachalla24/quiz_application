<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
    <title>Login</title>
</head>
<header>
        <h1>Welcome to Quiz Application</h1>
        <p>Test your knowledge with our interactive quizzes!</p>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/register">Register</a>
        {% if 'user_id' in session %}
            <a href="/logout">Logout</a>
        {% else %}
            <a href="/login">Login</a>
        {% endif %}
        <a href="/quiz">Start Quiz</a>
        <a href="/results"> Results</a>
    </nav>
<body>
    <h1>Login</h1>
    <main>
        <h2>Student Login</h2>
        <form id="loginForm">
            <label>Email</label>
            <input type="email" placeholder="Enter Your Email" id="loginEmail"><br><br>
            <label>Password</label>
            <input type="password" placeholder="Enter Your Password" id="loginPassword"><br><br>
            <button type="Submit" value="login">Login</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Quiz Application. All rights reserved.</p>
    </footer>
    <script src="{{url_for('static',filename='js/script.js')}}"></script> 
</body>
</html>
