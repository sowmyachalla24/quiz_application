<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
    <title>Register</title>
</head>
<header>
        <h1>Welcome to Quiz Application</h1>
        <p>Test your knowledge with our interactive quizzes!</p>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/register">Register</a>
        {% if 'user_id' in session %}
        <a href="/logout">Logout</a>
        {% else %}
        <a href="/login">Login</a>
        {% endif %}
        <a href="/quiz">Start Quiz</a>
        <a href="/results"> Results</a>
    </nav>
    <main>
        <h1>Register</h1>
        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" placeholder="Enter Your Name" id="name"><br><br>
            <label>Email</label>
            <input type="email" placeholder="Enter Your Email" id="email"><br><br>
            <label>Password</label>
            <input type="password" placeholder="Enter Your Password" id="password"><br><br>
            <label>Date of Birth</label>
            <input type="date" id="date"><br><br>
            <label>Gender</label>
            <input type="radio" name="gender" value="male" id="male">Male
            <input type="radio" name="gender" value="female" id="female">Female<br><br>
             <button type="submit" value="register">Register</button>
        </form>
        <footer>
            <p>&copy; 2026 Quiz Application. All rights reserved.</p>
        </footer>
        <script src="{{url_for('static',filename='js/script.js')}}"></script> 
</body>
</html>
